<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Lekgolokoe Sniper Signals</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #0a0e0f; color: #e8e8e8; margin: 0; padding: 0;
    -webkit-font-smoothing: antialiased;
  }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 18px; background: #0d1210; border-bottom: 1px solid #1a2420;
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .header-icon {
    width: 34px; height: 34px; background: #10221a; border-radius: 8px;
    display: flex; align-items: center; justify-content: center; color: #22c55e; font-size: 18px;
  }
  .header-title { font-weight: 700; font-size: 17px; letter-spacing: 1px; }
  .header-title .accent { color: #22c55e; }
  .live-badge {
    display: flex; align-items: center; gap: 6px; background: #10221a;
    padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; color: #22c55e;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; animation: pulse 1.5s infinite; }
  .dot.red { background: #ef4444; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  .banner {
    margin: 14px; border-radius: 14px; padding: 22px 18px; position: relative; overflow: hidden;
    background: linear-gradient(135deg, #0d1a14 0%, #0a0e0f 100%); border: 1px solid #1a2420;
  }
  .banner .tag { color: #22c55e; font-size: 11px; font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; }
  .banner h1 { margin: 0 0 6px; font-size: 24px; }
  .banner p { margin: 0; color: #8b9a94; font-size: 13px; }

  .statusbar {
    margin: 0 14px 14px; background: #101513; border: 1px solid #1a2420; border-radius: 12px;
    padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-between; font-size: 12px;
  }
  .statusbar span.label { color: #6b7a74; margin-right: 6px; }
  .statusbar span.val { font-weight: 700; }
  .val.green { color: #22c55e; } .val.orange { color: #f59e0b; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 0 14px 14px; }
  .stat-card {
    background: #101513; border: 1px solid #1a2420; border-radius: 12px; padding: 14px 6px;
    text-align: center;
  }
  .stat-card .icon { font-size: 18px; margin-bottom: 6px; }
  .stat-card .num { font-size: 20px; font-weight: 800; }
  .stat-card .lbl { font-size: 10px; color: #6b7a74; letter-spacing: 0.5px; margin-top: 2px; }
  .stat-card.signals .num { color: #22c55e; }
  .stat-card.gainers .num { color: #22c55e; }
  .stat-card.losers .num { color: #ef4444; }

  .section-title { padding: 0 18px 8px; font-size: 12px; color: #6b7a74; letter-spacing: 1px; font-weight: 700; }

  .price-list { padding: 0 14px 90px; display: flex; flex-direction: column; gap: 10px; }
  .price-card {
    background: #101513; border: 1px solid #1a2420; border-radius: 12px; padding: 14px 16px;
  }
  .price-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .price-symbol { font-size: 15px; font-weight: 700; }
  .price-change { font-size: 12px; margin-top: 3px; }
  .price-change.up { color: #22c55e; } .price-change.down { color: #ef4444; }
  .price-value { font-size: 20px; font-weight: 800; text-align: right; }
  .price-value.flash-up { animation: flashGreen 0.6s; }
  .price-value.flash-down { animation: flashRed 0.6s; }
  @keyframes flashGreen { 0% { color: #22c55e; } 100% { color: #e8e8e8; } }
  @keyframes flashRed { 0% { color: #ef4444; } 100% { color: #e8e8e8; } }
  .price-bottom {
    display: flex; justify-content: space-between; margin-top: 10px; padding-top: 10px;
    border-top: 1px solid #1a2420; font-size: 11px; color: #6b7a74;
  }

  .signal-card {
    background: #101513; border: 1px solid #1a2420; border-radius: 12px; padding: 14px 16px;
    border-left: 3px solid #22c55e;
  }
  .signal-card.sell { border-left-color: #ef4444; }
  .signal-dir { font-weight: 800; font-size: 15px; }
  .signal-dir.buy { color: #22c55e; } .signal-dir.sell { color: #ef4444; }
  .signal-meta { font-size: 11px; color: #6b7a74; margin-top: 4px; }
  .signal-reasons { font-size: 11px; color: #9ba8a2; margin-top: 8px; line-height: 1.6; }
  .empty-state { text-align: center; padding: 40px 20px; color: #4a5750; font-size: 13px; }

  .tabbar {
    position: fixed; bottom: 0; left: 0; right: 0; background: #0d1210; border-top: 1px solid #1a2420;
    display: flex; padding: 8px 0 12px;
  }
  .tab {
    flex: 1; text-align: center; color: #6b7a74; font-size: 10px; font-weight: 600; letter-spacing: 0.3px;
  }
  .tab .tab-icon { font-size: 18px; margin-bottom: 3px; }
  .tab.active { color: #22c55e; }

  .view { display: none; } .view.active { display: block; }
</style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <div class="header-icon">⚡</div>
      <div class="header-title">OTC <span class="accent">SNIPER</span></div>
    </div>
    <div class="live-badge"><span class="dot" id="liveDot"></span><span id="liveText">LIVE</span></div>
  </div>

  <div class="banner">
    <div class="tag">● LIVE FEED</div>
    <h1>OTC Signal Sniper</h1>
    <p>Real-time trading signals &amp; price analysis</p>
  </div>

  <div class="statusbar">
    <div><span class="label">STATUS</span><span class="val" id="connVal">Connecting</span></div>
    <div><span class="label">PAIRS</span><span class="val" id="pairsVal">0</span></div>
    <div><span class="label">SIGNALS</span><span class="val green" id="sigVal">0</span></div>
    <div><span class="label">UPTIME</span><span class="val" id="uptimeVal">00:00:00</span></div>
  </div>

  <div class="stats">
    <div class="stat-card"><div class="icon">📶</div><div class="num" id="activeCount">0</div><div class="lbl">ACTIVE</div></div>
    <div class="stat-card signals"><div class="icon">⚡</div><div class="num" id="signalsCount">0</div><div class="lbl">SIGNALS</div></div>
    <div class="stat-card gainers"><div class="icon">📈</div><div class="num" id="gainersCount">0</div><div class="lbl">GAINERS</div></div>
    <div class="stat-card losers"><div class="icon">📉</div><div class="num" id="losersCount">0</div><div class="lbl">LOSERS</div></div>
  </div>

  <div id="dashboardView" class="view active">
    <div class="section-title">LIVE PRICES</div>
    <div class="price-list" id="priceList">
      <div class="empty-state">Waiting for ticks...</div>
    </div>
  </div>

  <div id="signalsView" class="view">
    <div class="section-title">SIGNAL FEED</div>
    <div class="price-list" id="signalList">
      <div class="empty-state">No signals yet — building candles...</div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab active" data-view="dashboardView"><div class="tab-icon">▦</div>Dashboard</div>
    <div class="tab" data-view="signalsView"><div class="tab-icon">⚡</div>Signals</div>
  </div>

<script>
let socket;
let startTime = Date.now();
let signalCount = 0;
const prices = {};   // symbol -> { price, lastPrice, changePct }

function connectWebSocket() {
  socket = new WebSocket('ws://127.0.0.1:9000/ws');

  socket.onopen = () => {
    document.getElementById('liveDot').classList.remove('red');
    document.getElementById('liveText').textContent = 'LIVE';
    document.getElementById('connVal').textContent = 'Connected';
    document.getElementById('connVal').className = 'val green';
  };

  socket.onmessage = (event) => {
    try {
      const data = JSON.parse(event.data);
      if (data.type === 'signal') {
        handleSignal(data);
      } else if (data.symbol && data.price) {
        handleTick(data);
      }
    } catch (err) { console.error(err); }
  };

  socket.onclose = () => {
    document.getElementById('liveDot').classList.add('red');
    document.getElementById('liveText').textContent = 'OFFLINE';
    document.getElementById('connVal').textContent = 'Reconnecting...';
    document.getElementById('connVal').className = 'val orange';
    setTimeout(connectWebSocket, 5000);
  };

  socket.onerror = () => { socket.close(); };
}

function handleTick(data) {
  const sym = data.symbol;
  const price = parseFloat(data.price);
  const prev = prices[sym];
  const changePct = prev ? ((price - prev.price) / prev.price * 100) : 0;

  prices[sym] = { price, lastPrice: prev ? prev.price : price, changePct };
  renderPrices();
  updateStats();
}

function handleSignal(sig) {
  signalCount++;
  document.getElementById('sigVal').textContent = signalCount;
  document.getElementById('signalsCount').textContent = signalCount;

  const list = document.getElementById('signalList');
  const empty = list.querySelector('.empty-state');
  if (empty) empty.remove();

  const dirClass = sig.direction === 'BUY' ? 'buy' : 'sell';
  const card = document.createElement('div');
  card.className = 'signal-card ' + (sig.direction === 'BUY' ? '' : 'sell');
  card.innerHTML = `
    <div class="signal-dir ${dirClass}">${sig.otc_direction || sig.direction} • ${sig.symbol}</div>
    <div class="signal-meta">Strength ${sig.strength}% • Confidence ${sig.confidence}% • $${parseFloat(sig.price).toFixed(5)}</div>
    <div class="signal-reasons">${(sig.reasons || []).slice(0,4).join(' • ')}</div>
  `;
  list.prepend(card);
}

function renderPrices() {
  const list = document.getElementById('priceList');
  const syms = Object.keys(prices);
  if (syms.length === 0) return;
  list.innerHTML = '';
  syms.forEach(sym => {
    const p = prices[sym];
    const up = p.changePct >= 0;
    const card = document.createElement('div');
    card.className = 'price-card';
    card.innerHTML = `
      <div class="price-top">
        <div>
          <div class="price-symbol">${sym}</div>
          <div class="price-change ${up ? 'up' : 'down'}">${up ? '↑' : '↓'} ${p.changePct.toFixed(3)}%</div>
        </div>
        <div class="price-value">${p.price.toFixed(5)}</div>
      </div>
    `;
    list.appendChild(card);
  });
}

function updateStats() {
  const syms = Object.keys(prices);
  document.getElementById('pairsVal').textContent = syms.length;
  document.getElementById('activeCount').textContent = syms.length;
  const gainers = syms.filter(s => prices[s].changePct > 0).length;
  const losers = syms.filter(s => prices[s].changePct < 0).length;
  document.getElementById('gainersCount').textContent = gainers;
  document.getElementById('losersCount').textContent = losers;
}

function updateUptime() {
  const secs = Math.floor((Date.now() - startTime) / 1000);
  const h = String(Math.floor(secs / 3600)).padStart(2, '0');
  const m = String(Math.floor((secs % 3600) / 60)).padStart(2, '0');
  const s = String(secs % 60).padStart(2, '0');
  document.getElementById('uptimeVal').textContent = `${h}:${m}:${s}`;
}
setInterval(updateUptime, 1000);

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.view).classList.add('active');
  });
});

connectWebSocket();
</script>
</body>
</html>
